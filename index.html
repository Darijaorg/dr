<style>
    .notice-box {
        display: none;
        background-color: #fffef2; /* Subtle yellow, not too bright */
        border: 2px solid #e6e2c8;
        border-radius: 8px;
        padding: 20px;
        max-width: 600px;
        margin: 20px auto;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        color: #333;
        width: 300px;
        
    }

    .notice-box i {
        color: #d4c107; /* Slightly muted yellow for the icon */
        margin-right: 10px;
    }

    .notice-box p {
        margin: 0;
        line-height: 1.6;
        font-size: 12px;
    }

    .notice-box a {
        color: #d4c107;
        text-decoration: none;
        font-weight: bold;
    }

    .notice-box a:hover {
        text-decoration: underline;
        background-color: transparent;
    }

    .link{
    
     
     border: 0;
    padding: 0;
     margin: 0px;
     width: 0rem;
     text-align: 0;
     border-radius: 0;
     transition: 0;
     

    }
</style>
</head>

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Reference to your data in Firebase
        const noticeRef = database.ref('notice/index');

        // Fetch data from Firebase
        noticeRef.on('value', (snapshot) => {
            const data = snapshot.val();
        if(data){
            document.getElementById('notice-box').style.display = "flex"
            document.getElementById('notice-box').innerHTML = data
        }
        })
